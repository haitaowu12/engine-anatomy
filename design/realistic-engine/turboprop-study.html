:root{--paper:#f3f2ee;--ink:#202420;--mute:#5b625b;--faint:#7a817a;--line:#d0d4cb;--accent:#ad4527;--serif:Georgia,serif;--sans:system-ui,sans-serif;--mono:ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);line-height:1.5}
.lab-ui{pointer-events:none}.lab-ui .on{pointer-events:auto}
.lab-stage{position:fixed;inset:0 350px 0 0;pointer-events:auto;min-height:280px}
#lab-gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lab-side{position:relative;margin-left:calc(100% - 350px);padding:28px 24px;min-height:100vh;width:350px;pointer-events:auto}
.lab-title{font:normal 36px/1.15 var(--serif);margin:0}.lab-title i{display:block;font-size:26px;font-weight:normal;color:var(--mute)}
.lab-no,.lab-prompt,.lab-pills,.lab-cursor,.lab-flash,.lab-beat{display:none}
.lab-metric{margin-top:24px}.lbl,.lab-sub{font-size:14px;color:var(--mute)}.lbl b{color:var(--ink)}
.lab-big{font:normal 66px/1.15 var(--serif);white-space:nowrap}.lab-big i{font-size:28px;margin-left:5px;color:var(--mute)}
.lab-bar{height:4px;background:var(--line);margin:8px 0 12px}.lab-bar>div{height:100%;background:var(--ink)}.lab-bar.bad>div{background:var(--accent)}
.lab-ctl{margin-top:22px}.lab-ctl .row{display:flex;justify-content:space-between;font-size:14px}.lab-ctl input{width:100%;height:36px;accent-color:#245846}.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.lab-modes,.machine-views,.machine-subsystems{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--paper);padding:8px 12px;border-radius:5px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--mute)}button.act{background:#245846;color:#fff;border-color:#245846}button:disabled{opacity:.6;cursor:default}
button.brk{color:var(--accent)}button.brk.act{background:var(--accent);color:#fff}.lab-modes{font-size:12px}.lab-modes kbd{display:none}
:focus-visible{outline:3px solid #ad4527;outline-offset:3px}
.lab-how{margin-top:24px;font-size:14px;color:var(--mute)}.lab-how summary{cursor:pointer;color:var(--ink);font-weight:600}.lab-how .body{margin-top:12px}.eq{font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.lab-scale{position:absolute;bottom:20px;left:24px;font-size:12px;color:var(--mute);pointer-events:none}.lab-scale div{height:1px;background:var(--mute)}
.lab-labels{position:absolute;inset:0;pointer-events:none;z-index:1}.lab-labels svg{position:absolute;inset:0;width:100%;height:100%}
.lab-lab{position:absolute;font-size:12px;white-space:nowrap;transform:translateY(-50%);background:rgba(243,242,238,.95);padding:3px 5px;border-radius:3px;line-height:1.35}
.lab-lab small{display:block;font-size:11px;color:var(--mute)}.lab-lab.left{transform:translate(-100%,-50%)}[hidden]{display:none!important}
.machine-part-list{font-size:13px;padding-left:20px}.machine-part-list li{margin:7px 0}.machine-part-list small{display:block;color:var(--mute)}
.machine-credit{display:block;margin-top:28px;font-size:11px;color:var(--mute)}.machine-credit a{color:inherit}.machine-quality{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px}
#machine-loading{position:fixed;top:20px;left:20px;z-index:9;background:var(--paper);padding:10px}
.lab-capture *{transition:none!important;animation:none!important}
@media(max-width:760px){
 .lab-stage{position:relative;inset:auto;width:100%;height:48svh;min-height:300px}
 .lab-side{position:relative;margin:0;padding:20px;width:100%;min-height:0}
 .lab-title{font-size:32px}.lab-title i{font-size:23px}.lab-metric{margin-top:16px}.lab-big{font-size:54px}
 .lab-labels{display:none}.lab-scale{bottom:10px;left:20px}.lab-how{display:block}.machine-part-list{display:block}
}
